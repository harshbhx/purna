name: Accessibility problem
description: Something is hard or impossible to use with your setup
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Purna is for people after a stroke and their families, so this matters a lot. See [ACCESSIBILITY.md](https://github.com/harshbhx/purna/blob/main/ACCESSIBILITY.md) for what we already check.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Read the session replay on the family dashboard.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      placeholder: The screen reader read the chart but not how many diyas were missed.
    validations:
      required: true
  - type: checkboxes
    id: tools
    attributes:
      label: What do you use?
      options:
        - label: Screen reader
        - label: Screen magnifier or zoom
        - label: Keyboard only
        - label: Switch access or voice control
        - label: High contrast or dark mode
        - label: Reduced motion
  - type: input
    id: setup
    attributes:
      label: Device, browser and assistive technology (with versions if you know them)
      placeholder: iPhone, Safari, VoiceOver
