name: Bug
description: Something in the Lens or Purna Family doesn't work as the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Never paste family keys or doctor links.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Lens Studio preview, SPECS device, purna.dualmindlab.tech (family), Doctor view, Tests / CI]
    validations:
      required: true
