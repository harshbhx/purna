name = "purna-family"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "purna.dualmindlab.tech", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "purna"
# Placeholder. The deploy workflow writes the real id from the PURNA_D1_DATABASE_ID secret.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Rate limits for the routes anyone can reach (src/lib/limits.ts). Counted per Cloudflare location, approximate.
# namespace_id must be unique on the account so nothing else shares these counters.
[[ratelimits]]
name = "PAIR_LIMIT"
namespace_id = "26011"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "SESSION_LIMIT"
namespace_id = "26012"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "NOTE_LIMIT"
namespace_id = "26013"
  [ratelimits.simple]
  limit = 10
  period = 60

# Daily retention clean-up at 03:17 UTC (src/cleanup.ts).
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
