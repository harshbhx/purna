<title id="t">Purna's report tells three search styles apart</title>
<desc id="d">Means over 200 simulated sessions per player. Healthy: 100% of left diyas found, 0.0 hints, 0.0 chipped-on-left diyas lit, head turned up to 27° left. Left neglect: 65% of left diyas found, 2.9 hints, 0.0 chipped-on-left diyas lit, head turned up to 16° left. Object neglect: 100% of left diyas found, 0.0 hints, 5.6 chipped-on-left diyas lit, head turned up to 29° left.</desc>
<style>
  .bg { fill: #ffffff; } .t { fill: #1f1f1f; font: 600 20px system-ui, -apple-system, "Segoe UI", sans-serif; }
